limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
    listen 80;
    client_max_body_size 6m;                       # matches MAX_IMPORT_BYTES (EC-46)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # TLS: terminate here in non-local deployments (listen 443 ssl; ssl_certificate ...; redirect 80 -> 443)
    location /api/v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api:8000; }
    location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api:8000;
                     proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-For $remote_addr; }
    location / { proxy_pass http://frontend:3000; }
}
